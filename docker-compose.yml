services:
  frontend:
    build:
      context: ./frontend
    container_name: tripbuddy-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      target: development
    container_name: tripbuddy-gateway
    ports:
      - "4000:4000"
    environment:
      GATEWAY_PORT: 4000
      IDENTITY_SERVICE_URL: http://identity-service:4001
      TRIP_SERVICE_URL: http://trip-service:4002
      INTEGRATION_SERVICE_URL: http://integration-service:4003
    volumes:
      - ./services/gateway:/app
      - /app/node_modules
    depends_on:
      identity-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  integration-service:
    build:
      context: ./services/integration-service
      target: development
    container_name: tripbuddy-integration-service
    ports:
      - "4003:4003"
    environment:
      INTEGRATION_SERVICE_PORT: 4003
    volumes:
      - ./services/integration-service:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  identity-service:
    build:
      context: ./services/identity-service
      target: development
    container_name: tripbuddy-identity-service
    ports:
      - "4001:4001"
    environment:
      IDENTITY_SERVICE_PORT: 4001
      IDENTITY_DB_HOST: identity-db
      IDENTITY_DB_PORT: 5432
      IDENTITY_DB_NAME: identity_db
      IDENTITY_DB_USER: postgres
      IDENTITY_DB_PASSWORD: postgres
      IDENTITY_JWT_SECRET: tripbuddy_identity_secret
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./services/identity-service:/app
      - /app/node_modules
    depends_on:
      identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  trip-service:
    build:
      context: ./services/trip-service
      target: development
    container_name: tripbuddy-trip-service
    ports:
      - "4002:4002"
    environment:
      TRIP_SERVICE_PORT: 4002
      TRIP_DB_HOST: trip-db
      TRIP_DB_PORT: 5432
      TRIP_DB_NAME: trip_db
      TRIP_DB_USER: postgres
      TRIP_DB_PASSWORD: postgres
      TRIP_JWT_SECRET: tripbuddy_identity_secret
      IDENTITY_SERVICE_URL: http://identity-service:4001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./services/trip-service:/app
      - /app/node_modules
    depends_on:
      trip-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  identity-db:
    image: postgres:16
    container_name: tripbuddy-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - identity_db_data:/var/lib/postgresql/data

  trip-db:
    image: postgres:16
    container_name: tripbuddy-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trip_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trip_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - trip_db_data:/var/lib/postgresql/data

volumes:
  identity_db_data:
  trip_db_data:
